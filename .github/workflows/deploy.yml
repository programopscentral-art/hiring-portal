name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the deploy action
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages serves at /<repo-name>/. The workflow context exposes
          # the repo name in github.event.repository.name.
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      # GH Pages serves /<repo>/index.html on the root URL. The static adapter
      # writes 404.html as the SPA fallback; copy it to index.html so the root
      # also returns HTTP 200 (and contains the same SPA shell).
      - name: Copy fallback to index
        run: cp build/404.html build/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
